<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>T-Color</title>
    <style>
        #text1{
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            transition: color 0.5s ease;
        }
        #text1:hover{
            color: blue;
        }
        #btn1{
            position: fixed;
            top: 70%;
            left: 50%;
            transform: translateX(-50%);
            width: 12%;
            height: 4%;
            border-radius: 10px;
            border: none;
            background-color: black;
            color: white;
            font-size: 20px;
            transition: background-color 0.5s ease;
        }
        #btn1:hover{
            background-color: blue;
        }
        #btn2{
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 3%;
            border-radius: 10px;
            border: none;
            background-color: black;
            color: white;
            font-size: 20px;
            transition: background-color 0.5s ease;
        }
        #btn2:hover{
            background-color: blue;
        }
    </style>
</head>
<body>
    <h1 id="text1">T-Color</h1>
    <button id="btn1" onclick="window.location.href='Page1.html'">开始</button>
    <button id="btn2">t-color.github.io</button>
</body>
</html>
